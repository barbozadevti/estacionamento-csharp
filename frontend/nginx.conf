server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para os assets do build.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Fallback de SPA: qualquer rota desconhecida cai no index.html,
        # permitindo client-side routing caso seja adicionado no futuro.
        try_files $uri /index.html;
    }

    # Assets versionados pelo Vite podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
