services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      - Cors__OrigensPermitidas__0=http://localhost:3000
    volumes:
      - estacionamento-dados:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  estacionamento-dados:
